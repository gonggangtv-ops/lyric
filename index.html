<style id="lv-fxlib">.lv-fxlib-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.lv-fxcat{font-size:11px;font-weight:800;letter-spacing:.03em;opacity:.72;margin:14px 0 7px}
.lv-fxg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px 8px;padding-top:4px}
.lv-fxc{position:relative;min-width:0;display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:14px;border:1px solid #26262c;background:#121217;color:inherit;text-align:left;cursor:pointer;min-height:56px;transition:transform .15s,border-color .15s,box-shadow .15s,background .15s}
.lv-fxc:hover{border-color:#3d3d48;transform:translateY(-1px)}
.lv-fxc:focus-visible{outline:2px solid #ff2d7b;outline-offset:2px}
.lv-fxc.on{border-color:#ff2d7b;background:linear-gradient(135deg,rgba(255,45,123,.17),rgba(124,58,237,.13));box-shadow:0 0 0 1px rgba(255,45,123,.35),0 8px 20px -10px rgba(255,45,123,.7)}
.lv-fxc.on .lv-fxt{padding-right:12px}
.lv-fxc.on::after{content:"✓";position:absolute;bottom:5px;right:8px;font-size:11px;font-weight:900;color:#ff2d7b}
.lv-fxi{flex:0 0 36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:18px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.16),0 4px 10px -4px rgba(0,0,0,.6)}
.lv-fxt{display:flex;flex-direction:column;min-width:0;line-height:1.3}
.lv-fxt b{font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lv-fxt small{font-size:10px;opacity:.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lv-fxn{position:absolute;top:-7px;right:-4px;box-shadow:0 2px 6px rgba(0,0,0,.35);font-style:normal;font-size:8px;font-weight:900;padding:1px 5px;border-radius:6px;background:linear-gradient(90deg,#ff2d7b,#7c3aed);color:#fff;letter-spacing:.06em}
.lv-looks{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.lv-look{flex:0 0 auto;height:32px;padding:0 12px;border-radius:999px;border:1px solid #26262c;background:#15151b;color:inherit;font-size:11.5px;font-weight:700;white-space:nowrap;cursor:pointer;transition:background .15s,border-color .15s}
.lv-look:hover{border-color:#3d3d48}
.lv-look.on{background:linear-gradient(90deg,#ff2d7b,#7c3aed);border-color:transparent;color:#fff}
.lv-fxtune{display:grid;gap:10px;margin-top:16px;padding:12px;border-radius:14px}
